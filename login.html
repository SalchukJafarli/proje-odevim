<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Paneli</title>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            
            background: radial-gradient(circle at top right, #2c3e50, #000000);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        
        .glass-card {
            text-align: center;
            padding: 50px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }

        
        h1 {
            font-size: 50px;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #8e44ad);
            

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        
        p {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.4s ease;
            display: inline-block;
        }

        
        .btn-giris {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .btn-giris:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Merhaba</h1>
        
        <p>Salchuk Jafarlı'nın kişisel web sitesine hoşgeldiniz</p>
        
        <div class="btn-group">
            <a href="login.html" class="btn btn-giris">Giriş Yap</a>
        </div>
    </div>

</body>
</html>
