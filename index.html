<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Salchuk Jafarlı</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            border-bottom: 10px solid #7d3edb;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .welcome-title { font-size: 2.8rem; color: #333; margin-bottom: 10px; }
        .welcome-sub { font-size: 1.2rem; color: #7d3edb; font-weight: 500; margin-bottom: 30px; }
        .form-label { font-size: 1.2rem; font-weight: 600; color: #555; }
        .form-control { padding: 15px; font-size: 1.1rem; border-radius: 12px; border: 2px solid #eee; }
        .btn-custom {
            background-color: #7d3edb;
            color: white;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            margin-top: 25px;
            transition: 0.4s;
        }
        .btn-custom:hover { background-color: #622db3; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(125, 62, 219, 0.3); }
        .error-box {
            background-color: #fff5f5;
            color: #e53e3e;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #feb2b2;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center">
            <h1 class="welcome-title fw-bold">Hoş Geldiniz</h1>
            <p class="welcome-sub">Salchuk Jafarlı Kişisel Web Sitesi</p>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                document.write('<div class="error-box">⚠️ Kullanıcı adı veya şifre hatalı!</div>');
            }
            if (localStorage.getItem('loggedIn') === 'true') {
                window.location.href = 'hakkimda.html';
            }
        </script>

        <form action="index.php" method="POST">
            <div class="mb-4">
                <label for="email" class="form-label">E-posta Adresi</label>
                <input type="email" name="email" class="form-control" placeholder="b251210565@sakarya.edu.tr" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="Öğrenci Numaranız" required>
            </div>

            <button type="submit" class="btn btn-custom w-100">Giriş Yap</button>
        </form>
    </div>

</body>
</html>
