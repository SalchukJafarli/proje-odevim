<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Sakarya Üniversitesi</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #2c3e50, #000000);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 30px; color: #8e44ad; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #bdc3c7; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #8e44ad; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #8e44ad;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover { background: #9b59b6; }
        .error-msg {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Öğrenci Girişi</h2>
        
        
        <div id="error" class="error-msg">Hatalı giriş veya boş alan!</div>

        <form action="login.php" method="POST">
            <div class="form-group">
                <label>E-posta Adresi</label>
                <input type="text" name="email" placeholder="b2412100001@sakarya.edu.tr" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" placeholder="Öğrenci Numaranız" required>
            </div>
            <button type="submit" class="btn-login">Giriş Yap</button>
        </form>
    </div>

    <script>
        
        if(window.location.search.includes('error=1')) {
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
